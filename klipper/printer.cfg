#####################################################################
# theenderproject – Ender 3, Klipper
#
#   Mainboard : BTT Manta E3EZ + CB1, MCU in USB-to-CAN bridge mode
#   Toolhead  : BTT EBB36 Gen2 over CAN (see ebb36-gen2-toolhead.cfg)
#   X         : MGN9H rail (front), stock motor and belt
#   Y         : stock
#   Z         : kevinakasam belt-driven dual Z, MGN9H rails, two motors
#   Probe     : BTT Eddy Coil (on the EBB36), also used as the Z endstop
#
# Manta pins: Klipper generic-bigtreetech-manta-e3ez.cfg and BTT's
# Manta-E3EZ printer-ender3.cfg.
#
# Fill in every "TODO" before first start. MCU IDs are left blank.
#####################################################################

[include mainsail.cfg]            # or fluidd.cfg, whichever UI the CB1 image runs
[include ebb36-gen2-toolhead.cfg]
[include macros.cfg]

#####################################################################
# MCUs
#####################################################################

[mcu]
# The Manta runs as the USB-to-CAN bridge, so it is also addressed by
# canbus_uuid. Find it with:
#   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_uuid:                      # TODO: Manta E3EZ uuid

#####################################################################
# Printer
#####################################################################

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000                   # raise after SHAPER_CALIBRATE
max_z_velocity: 10                # belted Z can go faster than leadscrews; start here
max_z_accel: 100
square_corner_velocity: 5.0

#####################################################################
# X / Y  (stock Ender 3 motors, GT2 20T pulleys)
#####################################################################

[stepper_x]                       # Manta X slot
step_pin: PA14
dir_pin: !PA10                    # flip ! if X moves the wrong way
enable_pin: !PA13
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC4                 # stock X switch (X-STOP)
position_endstop: 0               # TODO: re-measure – the Mini Stealth moves the nozzle
position_min: 0
position_max: 235                 # TODO: check the full travel without crashing
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PB8
run_current: 0.580                # stock Ender 3 42-40 motor; adjust for yours
interpolate: false
stealthchop_threshold: 0          # spreadCycle

[stepper_y]                       # Manta Y slot
step_pin: PC8
dir_pin: !PA15
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB0                 # stock Y switch (Y-STOP)
position_endstop: 0               # TODO: re-measure – the front rail moves the nozzle forward
position_min: 0
position_max: 235                 # TODO
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC9
run_current: 0.580
interpolate: false
stealthchop_threshold: 0

#####################################################################
# Z – kevinakasam belt-driven dual Z
#   stepper_z  = left motor  (Manta Z slot)
#   stepper_z1 = right motor (Manta E0 slot – free, the extruder is on the EBB36)
#####################################################################

[stepper_z]
step_pin: PD2
dir_pin: PD4                      # flip ! if Z moves the wrong way
enable_pin: !PD3
microsteps: 16
rotation_distance: 8              # kevinakasam: the transmission matches the stock
                                  # leadscrew, so no change needed. TODO: verify by
                                  # commanding a 10 mm move and measuring it
endstop_pin: probe:z_virtual_endstop   # Eddy Coil homes Z; stock Z switch (PC6) unused
position_min: -2
position_max: 240                 # TODO: measure – the belted Z can lose some height
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PD0
run_current: 0.700                # the Z motors now hold the gantry; keep them hand-warm
interpolate: false
stealthchop_threshold: 0

[stepper_z1]
step_pin: PD5
dir_pin: PD6                      # TODO: must lift together with stepper_z – flip if not
enable_pin: !PB3
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PD1
run_current: 0.700
interpolate: false
stealthchop_threshold: 0

[z_tilt]
# Pivot points = where each Z belt lifts the gantry, in nozzle coordinates.
# TODO: measure from your frame. These assume the uprights sit ~40 mm outside the bed.
z_positions:
    -40, 117.5
    275, 117.5
# Probe points are NOZZLE positions; with the Eddy offset (+42, -6)
# these put the coil at X 52 / 225, Y 117.5.
points:
    10, 123.5
    183, 123.5
speed: 150
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.0075

#####################################################################
# Bed
#####################################################################

[heater_bed]
heater_pin: PB2                   # HB
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA3                   # TB
control: pid                      # BTT's stock-bed values; run PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 110

[safe_z_home]
home_xy_position: 75.5, 123.5     # puts the Eddy (+42, -6) over bed centre
z_hop: 10
z_hop_speed: 10
speed: 150

[bed_mesh]
# Mesh coordinates are PROBE positions
speed: 200
horizontal_move_z: 2              # BTT: the Eddy reading is invalid above ~4 mm
mesh_min: 47, 10
mesh_max: 225, 225
probe_count: 30, 30
algorithm: bicubic
scan_overshoot: 8
fade_start: 1
fade_end: 10

#####################################################################
# Manta-side fans and sensors
#####################################################################

[controller_fan electronics]      # optional: case fan on Manta FAN0
pin: PA8
idle_timeout: 120
stepper: stepper_x, stepper_y, stepper_z, stepper_z1

[temperature_sensor Manta]
sensor_type: temperature_mcu

[temperature_sensor CB1]
sensor_type: temperature_host

#####################################################################
# Misc
#####################################################################

[force_move]
enable_force_move: true           # needed for the first Eddy calibration

[exclude_object]

[gcode_arcs]
resolution: 0.5

[respond]

#[output_pin PS_ON]               # optional PSU relay
#pin: PA9

#####################################################################
# Spare Manta pins
#   E1 slot  : step PB7 / dir PB6 / enable !PB4 / uart PB5
#   Probe    : PA6 / PA7      Z-STOP : PC6
#   Fans     : PB15, PB14     RGB    : PC7      PS_ON : PA9
#####################################################################

