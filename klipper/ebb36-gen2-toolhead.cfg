#####################################################################
# Toolhead: Mini Stealth v2 on BTT EBB36 Gen2 (CAN)
#   Mellow Sherpa Micro + Bambu X1 hotend + BTT Eddy Coil
#
# Included from printer.cfg. Pins: BTT sample-bigtreetech-ebb36-gen2-v1.0.cfg
# Jumpers: USB/CAN = CAN, CAN-120R on, VFAN0 = VIN, VFAN2 = 5 V
#####################################################################

[mcu EBB]
canbus_uuid:                      # TODO: EBB36 uuid (canbus_query.py can0)

[extruder]
step_pin: EBB:PB14
dir_pin: EBB:PA8                  # add ! if it extrudes backwards
enable_pin: !EBB:PB6
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 22.6789511     # Sherpa drive gears; calibrate
gear_ratio: 50:10                 # 50:8 if the motor pinion is 8T
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBB:PB4
sensor_type: Generic 3950         # community-reported for the X1 thermistor; verify
sensor_pin: EBB:PA3
pullup_resistor: 2200             # per BTT's Gen2 sample
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150
max_extrude_cross_section: 5
pressure_advance: 0.04            # TODO: tune
control: pid                      # placeholder – replace with PID_CALIBRATE results
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.5                  # set from the motor's rating
stealthchop_threshold: 999999

[fan]
pin: EBB:PD3                      # FAN0, VFAN0 = VIN: 2x 24 V 4010 blowers

[heater_fan hotend_fan]
pin: EBB:PD2                      # FAN2, VFAN2 = 5 V: stock X1 fan
tachometer_pin: EBB:PA4
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[probe_eddy_current btt_eddy]     # BTT Eddy Coil on the I2C header
sensor_type: ldc1612
i2c_mcu: EBB
i2c_bus: i2c3_PA7_PA6             # if this fails, use the two lines below instead
#i2c_software_scl_pin: EBB:PA7
#i2c_software_sda_pin: EBB:PA6
x_offset: 42                      # ProbeRight side bracket (Mini Stealth readme)
y_offset: -6
z_offset: 1.0                     # BTT: any non-zero value

[lis2dw]
cs_pin: EBB:PB1
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z                   # TODO: check with ACCELEROMETER_QUERY

[resonance_tester]
accel_chip: lis2dw
probe_points: 117.5, 117.5, 20

[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

#[neopixel toolhead]
