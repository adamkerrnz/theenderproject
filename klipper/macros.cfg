#####################################################################
# Macros
#
# Slicer start G-code (OrcaSlicer / PrusaSlicer / SuperSlicer):
#   PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer]
# Slicer end G-code:
#   PRINT_END
# (Cura: PRINT_START BED={material_bed_temperature_layer_0} EXTRUDER={material_print_temperature_layer_0})
#####################################################################

[gcode_macro PRINT_START]
description: Heat, home, tilt, mesh, prime
gcode:
    {% set BED = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(220)|float %}
    M140 S{BED}                              # start the bed
    M104 S150                                # warm the nozzle, below oozing temp
    G90
    G28
    M190 S{BED}                              # Eddy Coil: probe at printing bed temp (no thermal compensation)
    Z_TILT_ADJUST
    G28 Z                                    # re-home Z after levelling the gantry
    BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan
    G1 X5 Y5 Z10 F9000
    M109 S{EXTRUDER}
    PRIME_LINE

[gcode_macro PRINT_END]
description: Retract, park, cool down
gcode:
    {% set max_y = printer.toolhead.axis_maximum.y|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set z_park = [printer.toolhead.position.z + 10, max_z]|min %}
    G91
    G1 E-2 F2700
    G90
    G1 Z{z_park} F600
    G1 X5 Y{max_y - 5} F6000                  # present the bed
    M400
    TURN_OFF_HEATERS
    M107
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    # Z stays powered so the gantry doesn't drop; idle_timeout releases it later

[gcode_macro PRIME_LINE]
description: Two-line purge along the left edge
gcode:
    G92 E0
    G1 X3 Y20 Z0.3 F5000
    G1 X3 Y200 E15 F1500
    G1 X3.4 Y200 F5000
    G1 X3.4 Y20 E15 F1500
    G92 E0
    G1 Z2 F3000

[gcode_macro LEVEL_GANTRY]
description: Home, Z_TILT_ADJUST, re-home Z
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z

[gcode_macro EDDY_FIRST_CALIBRATION]
description: Unhomed first-time Eddy setup – nozzle must be ~20 mm above the bed centre
gcode:
    G28 X Y
    G1 X75.5 Y123.5 F6000
    SET_KINEMATIC_POSITION Z=25
    RESPOND MSG="Z set to 25 without homing. Next: LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy, then SAVE_CONFIG"
